version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: user-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: userdb
    ports:
      - "64838:5432"

  user-service:
    image: eclipse-temurin:17-jdk
    # ou l'image de ton microservice si tu as buildé le jar dedans
    container_name: user-service
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    entrypoint: ["bash", "/app/wait-for-it.sh", "postgres:5432", "--", "java", "-jar", "/app/user-service-0.0.1-SNAPSHOT.jar"]
    volumes:
      - ./target/user-service-0.0.1-SNAPSHOT.jar:/app/user-service-0.0.1-SNAPSHOT.jar
      - ./wait-for-it.sh:/app/wait-for-it.sh
