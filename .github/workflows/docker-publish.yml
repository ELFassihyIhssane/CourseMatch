name: CD - Build & Push Images (GHCR)

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  push-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push course-service
        run: |
          docker build -t $REGISTRY/${{ github.repository_owner }}/course-service:$IMAGE_TAG ./course-service
          docker push $REGISTRY/${{ github.repository_owner }}/course-service:$IMAGE_TAG

      - name: Build & push user-service
        run: |
          docker build -t $REGISTRY/${{ github.repository_owner }}/user-service:$IMAGE_TAG ./user-service
          docker push $REGISTRY/${{ github.repository_owner }}/user-service:$IMAGE_TAG

      - name: Build & push recommendation-service
        run: |
          docker build -t $REGISTRY/${{ github.repository_owner }}/recommendation-service:$IMAGE_TAG ./recommendation-service
          docker push $REGISTRY/${{ github.repository_owner }}/recommendation-service:$IMAGE_TAG
